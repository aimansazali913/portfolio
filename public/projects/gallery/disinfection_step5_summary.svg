      <circle cx="24" cy="24" r="11" fill="#064e3b" stroke="#10b981"/>
      <text x="24" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">4</text>
